<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Yorks Airconditioning & Refrigeration LLC-SPC — controlled projects, materials, procurement and documents.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yorks AC. & Ref.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=golden-20260808">

  <!-- The signed-in shell paints this small seal immediately. Preload its
       display-sized rendition so it does not compete with the engine after
       the first Flutter frame has been scheduled. The document/native PNG
       remains separate and is loaded only by document workflows. -->
  <link rel="preload" href="assets/assets/branding/yorks_emblem_web.png" as="image" type="image/png" fetchpriority="high">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=golden-20260808"/>

  <title>Yorks AC. & Ref.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The R35 workspace owns local precision zoom. Keep normal pan/scroll
       gestures available to Flutter while preventing the browser/PWA from
       zooming the entire application shell. */
    html, body, flt-glass-pane {
      touch-action: pan-x pan-y;
    }
  </style>
</head>
<body>
  <script>
    // Prevent browser-wide zoom only. The event still reaches Flutter, whose
    // focused workspace listener handles Ctrl/Command-wheel and shortcuts.
    (() => {
      const isWorkspaceZoomShortcut = (event) =>
        (event.ctrlKey || event.metaKey) &&
        ['+', '=', '-', '_', '0'].includes(event.key);

      window.addEventListener(
        'keydown',
        (event) => {
          if (isWorkspaceZoomShortcut(event)) event.preventDefault();
        },
        { capture: true },
      );
      window.addEventListener(
        'wheel',
        (event) => {
          if (event.ctrlKey || event.metaKey) event.preventDefault();
        },
        { capture: true, passive: false },
      );
      // Prevent the browser's autoscroll/new-tab defaults for a physical
      // middle button, while preserving propagation to Flutter. The workspace
      // listener uses this exact gesture to pan a magnified route.
      window.addEventListener(
        'mousedown',
        (event) => {
          if (event.button === 1) event.preventDefault();
        },
        { capture: true },
      );
      window.addEventListener(
        'auxclick',
        (event) => {
          if (event.button === 1) event.preventDefault();
        },
        { capture: true },
      );
      window.addEventListener('gesturestart', (event) => event.preventDefault(), {
        passive: false,
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
